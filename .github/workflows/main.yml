name: Foodgram Workflow

on: push

jobs:
  backend_tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13.10
        env:
          POSTGRES_USER: foodgram_user
          POSTGRES_PASSWORD: foodgram_password
          POSTGRES_DB: foodgram_db
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install flake8==7.3.0 flake8-isort==7.0.0
          pip install -r ./backend/requirements.txt

      - name: Test with flake8
        run: python -m flake8 backend/

      - name: Run Django tests
        env:
          POSTGRES_USER: foodgram_user
          POSTGRES_PASSWORD: foodgram_password
          POSTGRES_DB: foodgram_db
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
        run: |
          cd backend/
          python manage.py test

  frontend_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: |
          cd frontend/
          npm install --legacy-peer-deps
      - name: Run frontend tests
        run: |
          cd frontend/
          npm run test

  build_backend:
    runs-on: ubuntu-latest
    needs: backend_tests
    if: github.ref_name == 'main'
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v2
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v4
        with:
          context: ./backend/
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/foodgram_backend:latest

  build_frontend:
    runs-on: ubuntu-latest
    needs: frontend_tests
    if: github.ref_name == 'main'
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v2
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v4
        with:
          context: ./frontend/
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/foodgram_frontend:latest

  build_gateway:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v2
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v4
        with:
          context: ./nginx/
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/foodgram_gateway:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [ build_backend, build_frontend, build_gateway ]
    if: github.ref_name == 'main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p ~/foodgram/infra
            cd ~/foodgram/infra

            cat > docker-compose.production.yml << 'EOF'
            volumes:
              pg_data:
              static:
              media:

            services:
              db:
                image: postgres:13.10
                env_file: .env
                volumes:
                  - pg_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

              backend:
                image: nastt/foodgram_backend:latest
                env_file: .env
                volumes:
                  - static:/backend_static
                  - media:/media
                  - ../data:/app/data:ro
                depends_on:
                  db:
                    condition: service_healthy

              frontend:
                image: nastt/foodgram_frontend:latest
                command: cp -r /app/build/. /frontend_static/
                volumes:
                  - static:/frontend_static

              gateway:
                image: nastt/foodgram_gateway:latest
                volumes:
                  - static:/staticfiles
                  - media:/media
                  - ../docs:/usr/share/nginx/html/api/docs
                ports:
                  - "7000:80"
                depends_on:
                  - backend
                  - frontend
            EOF

            cat > .env << 'EOF'
            POSTGRES_DB=foodgram
            POSTGRES_USER=foodgram_user
            POSTGRES_PASSWORD=foodgram_password
            DB_HOST=db
            DB_PORT=5432
            DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DJANGO_DEBUG=False
            DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,foodgram-yp-2026.duckdns.org,158.160.207.178
            DJANGO_CORS_ALLOWED_ORIGINS=https://foodgram-yp-2026.duckdns.org
            DJANGO_CSRF_TRUSTED_ORIGINS=https://foodgram-yp-2026.duckdns.org
            USE_POSTGRES=True
            EOF

            sudo docker compose -f docker-compose.production.yml pull
            sudo docker compose -f docker-compose.production.yml down
            sudo docker compose -f docker-compose.production.yml up -d
            sudo docker compose -f docker-compose.production.yml exec backend python manage.py migrate
            sudo docker compose -f docker-compose.production.yml exec backend python manage.py load_ingredients
            sudo docker compose -f docker-compose.production.yml exec backend python manage.py collectstatic --noinput
            sudo docker compose -f docker-compose.production.yml exec backend cp -r /app/collected_static/. /backend_static/static/

  send_message:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
             Foodgram успешно развернут!
