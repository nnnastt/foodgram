volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ../backend/
    env_file: .env
    volumes:
      - static:/backend_static
      - media:/media
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ../frontend/
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static:/frontend_static

  gateway:
    build: ../nginx/
    volumes:
      - static:/staticfiles
      - media:/media
      - ../docs:/usr/share/nginx/html/api/docs
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
