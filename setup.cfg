[flake8]
ignore =
    W503,
    F811,
    I005,
    I001
exclude =
    tests/,
    */migrations/,
    venv/,
    */venv/,
    .venv/,
    */.venv/,
    env/,
    */env/,
per-file-ignores =
    */settings.py:E501

[isort]
known_django =
    django
known_first_party =
    api,
    recipes,
    users
known_third_party =
    djoser,
    rest_framework,
    drf_extra_fields,
    django_filters,
    dotenv
sections =
    FUTURE,
    STDLIB,
    DJANGO,
    THIRDPARTY,
    FIRSTPARTY,
    LOCALFOLDER
default_section = THIRDPARTY
line_length = 79
